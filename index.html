<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1b1d24">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="吉他伴奏">
  <title>吉他伴奏</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>吉他伴奏</h1>
    <div class="top-btns">
      <button id="settingsBtn" class="top-btn only-score">⚙ 設定</button>
      <button id="hymnBtn" class="top-btn">📖 詩歌</button>
    </div>
  </header>

  <section id="scorePane" class="score-pane">
    <div class="score-head">
      <div class="score-info">
        <div id="hymnTitle" class="hymn-title"></div>
        <div id="hymnMeta" class="hymn-meta"></div>
      </div>
      <button id="prevHymn" aria-label="上一首">◀ 上一首</button>
      <button id="nextHymn" aria-label="下一首">下一首 ▶</button>
      <button id="hymnSwitch">換歌</button>
      <button id="hymnClose" aria-label="關閉樂譜">✕</button>
    </div>
    <div id="scoreScroll" class="score-scroll"></div>
  </section>

  <section class="controls">
    <div class="row">
      <label class="field">
        <span>譜上的調</span>
        <select id="sheetSel"></select>
      </label>
      <label class="field">
        <span>刷法</span>
        <select id="patternSel">
          <option value="strum">節奏刷</option>
          <option value="beat">每拍一下</option>
          <option value="arp">分解和弦</option>
        </select>
      </label>
    </div>

    <div class="field">
      <span>升降 Key（點中間回原調）</span>
      <div class="tempo keyshift">
        <button id="keyDown">降 Key</button>
        <button id="shiftVal" class="shift-val">原調</button>
        <button id="keyUp">升 Key</button>
      </div>
    </div>

    <div class="field">
      <span>拍號</span>
      <div class="seg wrap" id="meterSeg"></div>
    </div>

    <div class="field">
      <span>速度（每分鐘幾拍，一拍 = <b id="bpmUnit">四分音符</b>）</span>
      <div class="tempo">
        <button id="bpmDown" aria-label="減速">−</button>
        <div class="bpm-num" id="bpmVal">80</div>
        <button id="bpmUp" aria-label="加速">＋</button>
        <button id="tap" class="tap">點拍速</button>
      </div>
    </div>
  </section>

  <section class="display">
    <div class="now">
      <div id="chordName" class="chord-name">—</div>
      <div id="chordSub" class="chord-sub"></div>
    </div>
    <div id="beats" class="beats"></div>
    <div id="steps" class="steps"></div>
  </section>

  <section class="pitch">
    <div class="pitch-head">
      <span>起音 <b id="doLabel"></b></span>
    </div>
    <div id="solfege" class="solfege"></div>
  </section>

  <section id="pad" class="pad"></section>

  <footer class="bottom">
    <button id="playBtn" class="play">▶ 開始</button>
  </footer>

  <div id="hymnPicker" class="picker hidden">
    <div class="picker-box">
      <div class="picker-head">
        <b>選詩歌</b>
        <button id="hymnPickerClose" aria-label="關閉">✕</button>
      </div>
      <div id="hymnCats" class="seg wrap picker-cats"></div>
      <div class="picker-input" id="pickerNum">
        <button id="hymnFu" class="fu">附</button>
        <input id="hymnNum" type="search" enterkeyhint="search" autocomplete="off" placeholder="編號，或歌名／歌詞">
        <button id="hymnGo">開啟</button>
      </div>
      <div id="hymnResults" class="search-results"></div>
      <div id="myWrap" style="display:none">
        <button id="myImport" class="my-import">＋ 匯入樂譜圖片</button>
        <input id="myFile" type="file" accept="image/*" multiple hidden>
        <div class="picker-note">一次選多張 = 同一首的多頁。圖片只存在這支手機。</div>
        <div id="myList" class="my-list"></div>
      </div>
      <div id="hymnRecentWrap">
        <div class="picker-label">最近</div>
        <div id="hymnRecent" class="picker-recent"></div>
      </div>
      <div class="picker-note">開啟後會依譜自動設定調和拍號</div>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="hymn-s2t.js"></script>
  <script src="chord-templates.js"></script>
  <script src="chord-ocr.js"></script>
  <script src="my-songs.js"></script>
  <script src="hymn.js"></script>
</body>
</html>
