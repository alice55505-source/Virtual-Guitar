<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1b1d24">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="吉他伴奏">
  <title>吉他伴奏</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>吉他伴奏</h1>
    <div class="top-btns">
      <button id="settingsBtn" class="top-btn">⚙ 設定</button>
      <button id="hymnBtn" class="top-btn">📖 詩歌</button>
    </div>
  </header>

  <section id="scorePane" class="score-pane">
    <div class="score-head">
      <div class="score-info">
        <div id="hymnTitle" class="hymn-title"></div>
        <div id="hymnMeta" class="hymn-meta"></div>
      </div>
      <button id="prevHymn" aria-label="上一首">◀</button>
      <button id="nextHymn" aria-label="下一首">▶</button>
      <button id="lyrBtn" class="lyr-btn" style="display:none">📝 歌詞</button>
      <button id="lyrEditBtn" style="display:none">✎ 改和弦</button>
      <button id="hymnSwitch">換歌</button>
      <button id="hymnClose" aria-label="關閉樂譜">✕</button>
    </div>
    <div id="scoreScroll" class="score-scroll"></div>
    <div id="lyricsBox" class="lyrics-box"></div>
  </section>

  <section class="controls">
    <div class="card">
      <div class="card-title">這首歌</div>
      <div class="set-row">
        <span class="set-label">譜上的調</span>
        <select id="sheetSel"></select>
      </div>
      <div class="set-row">
        <span class="set-label">升降 Key<small>點中間回原調</small></span>
        <div class="stepper">
          <button id="keyDown" aria-label="降 Key">−</button>
          <button id="shiftVal" class="shift-val">原調</button>
          <button id="keyUp" aria-label="升 Key">＋</button>
        </div>
      </div>
      <div class="set-col">
        <span class="set-label">拍號</span>
        <div class="seg wrap" id="meterSeg"></div>
      </div>
      <div class="set-row">
        <span class="set-label">速度<small>一拍 = <b id="bpmUnit">四分音符</b></small></span>
        <div class="stepper">
          <button id="bpmDown" aria-label="減速">−</button>
          <div class="bpm-num" id="bpmVal">80</div>
          <button id="bpmUp" aria-label="加速">＋</button>
        </div>
      </div>
      <button id="tap" class="tap">👆 點拍速<small>　跟著拍子連點幾下</small></button>
    </div>

    <div class="card">
      <div class="card-title">彈法與按鍵</div>
      <div class="set-col">
        <span class="set-label">刷法</span>
        <div class="seg three" id="patternSeg">
          <button data-v="strum">節奏刷</button><button data-v="beat">每拍一下</button><button data-v="arp">分解和弦</button>
        </div>
      </div>
      <div class="set-col">
        <span class="set-label">和弦鍵</span>
        <div class="seg three" id="orderSeg">
          <button data-v="basic">基礎 6 個</button><button data-v="common">常用</button><button data-v="seq">順序</button>
        </div>
      </div>
      <div class="set-col">
        <span class="set-label">按鍵大小</span>
        <div class="seg three" id="sizeSeg">
          <button data-v="normal">標準</button><button data-v="large">大</button><button data-v="xl">特大</button>
        </div>
      </div>
    </div>
  </section>

  <section class="display">
    <div class="now">
      <div id="chordName" class="chord-name">—</div>
      <div id="chordSub" class="chord-sub"></div>
    </div>
    <div id="beats" class="beats"></div>
    <div id="steps" class="steps"></div>
  </section>

  <section class="pitch">
    <div class="pitch-head">
      <span>起音 <b id="doLabel"></b></span>
      <button id="pitchToggle" class="pitch-toggle">起音鍵 ▾</button>
    </div>
    <div id="solfege" class="solfege"></div>
  </section>

  <div id="stepBar" class="step-bar" style="display:none">
    <button id="stepPrev" aria-label="上一個和弦">◀</button>
    <button id="stepNext">▶ 從頭開始</button>
  </div>
  <section id="pad" class="pad"></section>

  <footer class="bottom">
    <button id="playBtn" class="play">▶ 開始</button>
  </footer>

  <div id="hymnPicker" class="picker hidden">
    <div class="picker-box">
      <div class="picker-head">
        <b>選詩歌</b>
        <button id="hymnPickerClose" aria-label="關閉">✕</button>
      </div>
      <div id="hymnCats" class="seg wrap picker-cats"></div>
      <div class="picker-input" id="pickerNum">
        <button id="hymnFu" class="fu">附</button>
        <input id="hymnNum" type="search" enterkeyhint="search" autocomplete="off" placeholder="編號，或歌名／歌詞">
        <button id="hymnGo">開啟</button>
      </div>
      <div id="hymnResults" class="search-results"></div>
      <div id="myWrap" style="display:none">
        <button id="myImport" class="my-import">＋ 匯入樂譜圖片</button>
        <input id="myFile" type="file" accept="image/*" multiple hidden>
        <div class="picker-note">一次選多張 = 同一首的多頁。圖片只存在這支手機。</div>
        <div id="myList" class="my-list"></div>
      </div>
      <div id="hymnRecentWrap">
        <div class="picker-label">最近</div>
        <div id="hymnRecent" class="picker-recent"></div>
      </div>
      <div class="picker-note">開啟後會依譜自動設定調和拍號</div>
    </div>
  </div>

  <div id="chordPop" class="picker hidden">
    <div class="picker-box">
      <div class="picker-head"><b>選和弦</b><button id="chordPopCancel" aria-label="取消">✕</button></div>
      <div id="chordPopGrid" class="chord-pop-grid"></div>
      <button id="chordPopDel" class="chord-pop-del">移除這個和弦</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="hymn-s2t.js"></script>
  <script src="chord-templates.js"></script>
  <script src="chord-ocr.js"></script>
  <script src="my-songs.js"></script>
  <script src="chord-lyrics.js"></script>
  <script src="lyrics-view.js"></script>
  <script src="hymn.js"></script>
</body>
</html>
