<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1b1d24">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="吉他伴奏">
  <title>吉他伴奏</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>吉他伴奏</h1>
  </header>

  <section class="controls">
    <div class="row">
      <label class="field">
        <span>譜上的調</span>
        <select id="sheetSel"></select>
      </label>
      <label class="field">
        <span>大/小調</span>
        <select id="scaleSel">
          <option value="major">大調</option>
          <option value="minor">小調</option>
        </select>
      </label>
      <label class="field">
        <span>刷法</span>
        <select id="patternSel">
          <option value="strum">節奏刷</option>
          <option value="beat">每拍一下</option>
          <option value="arp">分解和弦</option>
        </select>
      </label>
    </div>

    <div class="field">
      <span>升降 Key（點中間回原調）</span>
      <div class="tempo keyshift">
        <button id="keyDown">降 Key</button>
        <button id="shiftVal" class="shift-val">原調</button>
        <button id="keyUp">升 Key</button>
      </div>
    </div>

    <div class="field">
      <span>拍號</span>
      <div class="seg wrap" id="meterSeg"></div>
    </div>

    <div class="field">
      <span>速度（<b id="bpmUnit">♩</b> = 每分鐘幾拍）</span>
      <div class="tempo">
        <button id="bpmDown" aria-label="減速">−</button>
        <div class="bpm-num" id="bpmVal">80</div>
        <button id="bpmUp" aria-label="加速">＋</button>
        <button id="tap" class="tap">點拍速</button>
      </div>
    </div>
  </section>

  <section class="display">
    <div class="now">
      <div id="chordName" class="chord-name">—</div>
      <div id="chordSub" class="chord-sub"></div>
    </div>
    <div id="beats" class="beats"></div>
    <div id="steps" class="steps"></div>
  </section>

  <section class="pitch">
    <div class="pitch-head">
      <span>起音 <b id="doLabel"></b></span>
    </div>
    <div id="solfege" class="solfege"></div>
  </section>

  <section id="pad" class="pad"></section>

  <footer class="bottom">
    <button id="playBtn" class="play">▶ 開始</button>
  </footer>

  <script src="app.js"></script>
</body>
</html>
